<div class="flex h-dvh overflow-hidden bg-canvas text-ink">
  <header
    class="shell-topbar fixed inset-x-0 top-0 z-30 flex h-14 items-center gap-3 bg-surface/95 px-4 backdrop-blur-sm md:hidden"
  >
    <button
      (click)="openMobileNav()"
      [attr.aria-expanded]="mobileNavOpen()"
      aria-controls="app-shell-sidebar"
      aria-label="Ouvrir le menu"
      class="shell-icon-btn pressable size-9"
      type="button"
    >
      <ng-icon class="text-base" name="lucideMenu" />
    </button>
    <a
      class="font-display text-lg font-medium tracking-tight text-ink"
      routerLink="/"
    >
      LogiFlow
    </a>
  </header>

  @if (mobileNavOpen()) {
  <button
    (click)="closeMobileNav()"
    aria-label="Fermer le menu"
    class="fixed inset-0 z-40 bg-ink/40 backdrop-blur-[2px] md:hidden"
    type="button"
  ></button>
  }

  <aside
    [attr.data-mobile-open]="mobileNavOpen()"
    [attr.inert]="mobileNavInert() ? '' : null"
    [class.-translate-x-full]="!mobileNavOpen()"
    [class.translate-x-0]="mobileNavOpen()"
    aria-label="Navigation principale"
    class="shell-sidebar fixed inset-y-0 left-0 z-50 flex w-64 flex-col bg-surface md:static md:z-auto md:translate-x-0"
    id="app-shell-sidebar"
  >
    <div
      class="flex h-14 shrink-0 items-center justify-between gap-2 border-b border-line/80 px-4 md:h-16 md:px-5"
    >
      <a
        (click)="closeMobileNav()"
        class="font-display text-xl font-medium tracking-tight text-ink"
        routerLink="/"
      >
        LogiFlow
      </a>
      @if (mobileNavOpen()) {
      <button
        (click)="closeMobileNav()"
        aria-label="Fermer le menu"
        class="shell-icon-btn shell-sidebar-dismiss pressable size-8"
        type="button"
      >
        <ng-icon aria-hidden="true" class="text-sm" name="lucideX" />
      </button>
      }
    </div>

    <div class="shrink-0 px-3 pt-3 pb-1">
      <button
        (click)="openCommandPalette()"
        class="shell-search-trigger pressable"
        type="button"
      >
        <span aria-hidden="true" class="shell-jump-leading">
          <ng-icon class="text-[0.9375rem]" name="lucideSearch" />
        </span>
        <span class="shell-search-trigger__label">Rechercher…</span>
        <kbd class="shell-kbd ml-auto hidden sm:inline-flex" title="Raccourci clavier">
          <span>Ctrl</span>
          <span>K</span>
        </kbd>
      </button>
    </div>

    <nav
      aria-label="Modules"
      class="shell-nav-modules min-h-0 flex-1 overflow-y-auto"
    >
      <div class="shell-nav-home">
        <a
          (click)="closeMobileNav()"
          [routerLinkActiveOptions]="{ exact: true }"
          class="shell-nav-link pressable"
          routerLink="/"
          routerLinkActive="is-active"
        >
          <span aria-hidden="true" class="shell-nav-link__icon">
            <ng-icon [name]="tableauIcon" class="shell-nav-link__glyph" />
          </span>
          <span class="shell-nav-link__label">Tableau de bord</span>
        </a>
      </div>

      @for (group of navGroups(); track group.section) {
      <ul class="shell-nav-group">
        @for (item of group.items; track item.id) {
        <li>
          <a
            (click)="closeMobileNav()"
            [routerLink]="'/' + item.path"
            class="shell-nav-link pressable"
            routerLinkActive="is-active"
          >
            <span aria-hidden="true" class="shell-nav-link__icon">
              <ng-icon [name]="iconFor(item.id)" class="shell-nav-link__glyph" />
            </span>
            <span class="shell-nav-link__label">{{ item.label }}</span>
          </a>
        </li>
        }
      </ul>
      }
    </nav>

    <div class="shell-user-footer shrink-0">
      <p class="font-mono text-xs text-ink">{{ login() }}</p>
      <p class="mt-0.5 text-[0.7rem] text-muted">{{ roleName() }}</p>
      <button
        (click)="signOut()"
        class="shell-sign-out pressable"
        type="button"
      >
        Déconnexion
      </button>
    </div>
  </aside>

  <div class="flex min-h-0 min-w-0 flex-1 flex-col overflow-hidden pt-14 md:pt-0">
    <header
      class="shell-topbar shell-topbar--main sticky top-0 z-20 flex h-14 shrink-0 items-center gap-4 bg-surface/90 px-4 backdrop-blur-md md:h-16 md:gap-5 md:px-6"
    >
      <app-shell-breadcrumb />

      <div aria-label="Actions rapides" class="shell-topbar-actions" role="group">
        <app-copilote-bouton />

        @if (showFileDuJourBadge()) {
        <span aria-hidden="true" class="shell-topbar-divider"></span>
        <a
          [attr.aria-label]="fileDuJourBadgeAriaLabel()"
          [fragment]="fileDuJourSectionId"
          class="shell-pill shell-inbox-pill pressable shrink-0"
          routerLink="/"
        >
          <ng-icon class="shell-pill-icon text-sm" name="lucideInbox" />
          <span class="hidden sm:inline">File du jour</span>
          <app-statut-chip
            [label]="fileDuJourBadgeCount().toString()"
            [tone]="fileDuJourBadgeTone()"
            class="tabular-nums"
          />
        </a>
        }
      </div>
    </header>

    <main cdkScrollable class="min-h-0 flex-1 overflow-y-auto">
      <div class="page-shell">
        <router-outlet />
      </div>
    </main>
  </div>

  <app-toast-host />
</div>
