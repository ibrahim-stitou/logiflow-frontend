name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-frontend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Installer
        uses: ./.github/actions/setup

      - name: Vérifier le lint et le formatage (Ultracite)
        run: pnpm check

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Installer
        uses: ./.github/actions/setup

      - name: Exécuter les tests unitaires (Vitest)
        run: pnpm exec ng test --watch=false

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Installer
        uses: ./.github/actions/setup

      - name: Construire (production)
        run: pnpm build

      - name: Publier le build
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # Publication conditionnée aux tests, au build et à l'analyse Trivy, mais pas au lint : la dette
  # de formatage existante (formateur HTML de Biome incompatible avec certaines liaisons Angular)
  # ne doit pas bloquer la livraison. Le lint reste obligatoire pour le statut global « CI ».
  docker:
    name: Image Docker
    needs: [test, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    env:
      PUBLIER: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Préparer Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Se connecter à GHCR
        if: env.PUBLIER == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR exige un nom d'image en minuscules (le propriétaire du dépôt en contient).
      - name: Nom de l'image
        id: image
        run: echo "nom=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/logiflow-frontend" >> "$GITHUB_OUTPUT"

      - name: Construire l'image du frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: logiflow-frontend:analyse
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Analysée AVANT publication : une CVE CRITIQUE corrigeable bloque la publication.
      - name: Analyser l'image (Trivy, bloquant sur CRITICAL corrigeable)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: logiflow-frontend:analyse
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Publiée uniquement sur push vers main : consommée par logiflow-infra. Une même image sert
      # tous les environnements (URL Keycloak lues au démarrage, voir docker/40-logiflow-config.sh).
      # SBOM et provenance (SLSA) attachés à l'image.
      - name: Publier l'image du frontend
        if: env.PUBLIER == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ steps.image.outputs.nom }}:latest
            ${{ steps.image.outputs.nom }}:${{ github.sha }}
          cache-from: type=gha

  ci:
    name: CI
    needs: [lint, test, build, docker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Vérifier que tous les jobs ont réussi
        run: |
          test "${{ needs.lint.result }}" = success
          test "${{ needs.test.result }}" = success
          test "${{ needs.build.result }}" = success
          test "${{ needs.docker.result }}" = success
